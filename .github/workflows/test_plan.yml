name: DR2 Run Terraform Plan
on:
  pull_request:
    paths:
      - "terraform/**"
permissions:
  id-token: write
  contents: write
jobs:
  test_plan:
    runs-on: ubuntu-latest
    environment: intg
    steps:
      - name: Provision runner
        uses: nationalarchives/org-actions-provision-runner@5657f48ecd0fd31bfe857919149f1fdc690d53ed # v1.0.1
        with:
          wiz-sensor-token: ${{ secrets.WIZ_SENSOR_TOKEN }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
          token: ${{ secrets.WORKFLOW_TOKEN }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::${{ secrets.ACCOUNT_NUMBER }}:role/IntgTerraformRole
          aws-region: eu-west-2
          role-session-name: TerraformTestPlan
      - run: |
          terraform init
          terraform workspace select intg
          export TF_VAR_lambda_code_version=$(gh api /repos/nationalarchives/dr2-ingest/tags | jq -r '.[0].name')
          terraform plan -refresh=false -lock=false
        working-directory: terraform
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
