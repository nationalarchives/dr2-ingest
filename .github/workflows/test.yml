name: DR2 Run Lambda Tests
on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/README.md"
permissions:
  id-token: write
  contents: write
jobs:
  dependency_review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: sbt/setup-sbt@c7d2d6258b4bd0d3ec5129e6b3453199d3c79729 # v1.5.8
      - uses: scalacenter/sbt-dependency-submission@d84eef4c09e633bcf5f113bcad7fd5e9af1baee9 # v3.2.3
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: sbt/setup-sbt@c7d2d6258b4bd0d3ec5129e6b3453199d3c79729 # v1.5.8
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - parallel:
        - name: Run Wiz scan
          run: |
            curl -Lo wizcli https://downloads.wiz.io/v1/wizcli/latest/wizcli-linux-amd64
            curl -Lo /tmp/wizcli-sha256 https://downloads.wiz.io/v1/wizcli/latest/wizcli-linux-amd64-sha256
            curl -Lo /tmp/wizcli-sha256.sig https://downloads.wiz.io/v1/wizcli/latest/wizcli-linux-amd64-sha256.sig
            chmod +x wizcli
            curl -Lo public_key.asc https://downloads.wiz.io/wizcli/public_key.asc
            gpg --import public_key.asc
            gpg --verify /tmp/wizcli-sha256.sig /tmp/wizcli-sha256
            echo "$(cat /tmp/wizcli-sha256) wizcli" | sha256sum --check
            ./wizcli scan dir . --project $WIZ_PROJECT_ID
          env:
            WIZ_CLIENT_ID: ${{ secrets.WIZ_CLIENT_ID }}
            WIZ_CLIENT_SECRET: ${{ secrets.WIZ_CLIENT_SECRET }}
            WIZ_PROJECT_ID: ${{ secrets.WIZ_PROJECT_DR2 }}
        - name: Run scalafmt
          run: sbt scalafmtCheckAll
        - name: Run Terraform checks
          run: (cd terraform && terraform fmt -check --recursive)
        - name: Run Python tests
          run: |
            find . -name requirements.txt | xargs -I {} pip install -r {}
            pytest
          env:
            AWS_DEFAULT_REGION: eu-west-2
            AWS_ACCESS_KEY_ID: test
            AWS_SECRET_ACCESS_KEY: test
        - name: Run Kotlin tests
          run: (cd kotlin/e2e-tests/lib && gradle test)
  discover_sbt_tests:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.projects.outputs.projects }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: sbt/setup-sbt@c7d2d6258b4bd0d3ec5129e6b3453199d3c79729 # v1.5.8
      - name: Discover subprojects
        id: projects
        run: |
          projects=$(sbt -batch -no-colors 'listProjectIds' | tail -n 1)
          echo "projects=$projects" >> "$GITHUB_OUTPUT"
  run_sbt_tests:
    runs-on: ubuntu-latest
    needs: discover_sbt_tests
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.discover_sbt_tests.outputs.projects) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: sbt/setup-sbt@c7d2d6258b4bd0d3ec5129e6b3453199d3c79729 # v1.5.8
      - run: sbt -no-colors "${{ matrix.project }}/test"


