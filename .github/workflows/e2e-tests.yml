name: Run DR2 Ingest End-to-End Tests
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options:
          - intg
          - staging
        description: The environment to run the tests for
      to-deploy:
        type: string
        description: The version to deploy. Used to trigger a deploy in the next environment
permissions:
  id-token: write
  contents: write
env:
  TO_DEPLOY: ${{ github.event.inputs.to-deploy }}
jobs:
  run_tests:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Provision runner
        uses: nationalarchives/org-actions-provision-runner@5657f48ecd0fd31bfe857919149f1fdc690d53ed # v1.0.1
        with:
          wiz-sensor-token: ${{ secrets.WIZ_SENSOR_TOKEN }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sbt/setup-sbt@bfea3c5f48abd221b04a6df4798aa5eb8b6a2baf # v1.5.6
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Configure AWS credentials for Lambda
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-duration-seconds: 7200
          role-to-assume: arn:aws:iam::${{ secrets.ACCOUNT_NUMBER }}:role/${{ github.event.inputs.environment }}-dr2-run-e2e-tests-role
          aws-region: eu-west-2
          role-session-name: RunE2ETestsRole
      - run: |
          chmod +x .github/scripts/invoke_flow_control_lambda.sh
          .github/scripts/invoke_flow_control_lambda.sh "$FLOW_CONTROL_ARN" 300 &
          FLOW_CONTROL_JOB_PID=$!
          trap 'kill "$FLOW_CONTROL_JOB_PID" 2>/dev/null || true' EXIT

          cd kotlin/e2e-tests/e2etests/
          gradle test
        env:
          INGEST_SQS_QUEUE: https://sqs.eu-west-2.amazonaws.com/${{ secrets.ACCOUNT_NUMBER }}/${{ github.event.inputs.environment }}-dr2-preingest-tdr-importer
          JUDGMENT_SQS_QUEUE: https://sqs.eu-west-2.amazonaws.com/${{ secrets.ACCOUNT_NUMBER }}/${{ github.event.inputs.environment }}-dr2-preingest-courtdoc-importer
          ADHOC_SQS_QUEUE: https://sqs.eu-west-2.amazonaws.com/${{ secrets.ACCOUNT_NUMBER }}/${{ github.event.inputs.environment }}-dr2-preingest-adhoc-importer
          DRI_SQS_QUEUE: https://sqs.eu-west-2.amazonaws.com/${{ secrets.ACCOUNT_NUMBER }}/${{ github.event.inputs.environment }}-dr2-preingest-dri-importer
          EXTERNAL_LOG_GROUP: arn:aws:logs:eu-west-2:${{ secrets.ACCOUNT_NUMBER }}:log-group:/${{ github.event.inputs.environment }}-external-notifications
          PREINGEST_SFN_ARN: arn:aws:states:eu-west-2:${{ secrets.ACCOUNT_NUMBER }}:stateMachine:${{ github.event.inputs.environment }}-dr2-preingest-tdr
          COPY_FILES_LOG_GROUP: arn:aws:logs:eu-west-2:${{ secrets.ACCOUNT_NUMBER }}:log-group:/aws/lambda/${{ github.event.inputs.environment }}-dr2-preingest-tdr-importer
          COPY_ADHOC_FILES_LOG_GROUP: arn:aws:logs:eu-west-2:${{ secrets.ACCOUNT_NUMBER }}:log-group:/aws/lambda/${{ github.event.inputs.environment }}-dr2-preingest-adhoc-importer
          COPY_DRI_FILES_LOG_GROUP:  arn:aws:logs:eu-west-2:${{ secrets.ACCOUNT_NUMBER }}:log-group:/aws/lambda/${{ github.event.inputs.environment }}-dr2-preingest-dri-importer
          COPY_JUDGMENT_FILES_LOG_GROUP:  arn:aws:logs:eu-west-2:${{ secrets.ACCOUNT_NUMBER }}:log-group:/aws/lambda/${{ github.event.inputs.environment }}-dr2-preingest-courtdoc-importer
          S3_BUCKET: ${{ github.event.inputs.environment }}-dr2-ingest-raw-cache
          ADHOC_BUCKET: ${{ github.event.inputs.environment }}-dr2-ingest-adhoc-cache
          DRI_BUCKET:  ${{ github.event.inputs.environment }}-dr2-ingest-dri-migration-cache
          LOCK_TABLE: ${{ github.event.inputs.environment }}-dr2-ingest-lock
          ACCOUNT_NUMBER: ${{ secrets.ACCOUNT_NUMBER }}
          INGEST_SFN_NAME: ${{ github.event.inputs.environment }}-dr2-ingest
          FLOW_CONTROL_ARN: arn:aws:lambda:eu-west-2:${{ secrets.ACCOUNT_NUMBER }}:function:${{ github.event.inputs.environment }}-dr2-ingest-flow-control

      - run: gh workflow run deploy.yml -f environment=staging -f to-deploy=$TO_DEPLOY
        if: ${{ github.event.inputs.environment == 'intg' }}
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
      - run: gh workflow run deploy.yml -f environment=prod -f to-deploy=$TO_DEPLOY
        if: ${{ github.event.inputs.environment == 'staging' }}
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
